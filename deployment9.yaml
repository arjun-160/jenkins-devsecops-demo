apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisecure
  labels:
    app: medisecure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medisecure
  template:
    metadata:
      labels:
        app: medisecure
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: medisecure:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medi-secrets
                  key: SECRET_KEY
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medi-secrets
                  key: DEMO_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medisecure-service
spec:
  type: NodePort
  selector:
    app: medisecure
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30100
